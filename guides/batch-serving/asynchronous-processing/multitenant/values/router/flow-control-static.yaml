# FORK EXPERIMENT ONLY (not part of the guide): flow control with neither
# priority holdback nor in-flight eviction (static usage limit 1.0), to
# compare llm-d-async saturation gates without router-side protection.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
  monitoring:
    prometheus:
      enabled: true
      auth:
        enabled: false
  epp:
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"
    pluginsConfigFile: "flow-control-plugins.yaml"
    pluginsCustomConfig:
      flow-control-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        featureGates:
        - flowControl
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: round-robin-fairness-policy
        - type: fcfs-ordering-policy
        - type: concurrency-detector
          parameters:
            maxConcurrency: 10
            concurrencyMode: requests
            headroom: 0.0
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3

        flowControl:
          maxBytes: "10Gi"
          maxRequests: "1k"
          defaultRequestTTL: "300s"
          saturationDetector:
            pluginRef: concurrency-detector
          priorityBands:
          - priority: 100
            maxRequests: "500"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: 60
            maxRequests: "500"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: 30
            maxRequests: "500"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: 10
            maxRequests: "500"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: -5
            maxRequests: "500"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy
          - priority: -10
            maxRequests: "500"
            fairnessPolicyRef: round-robin-fairness-policy
            orderingPolicyRef: fcfs-ordering-policy

  proxy:
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        memory: "8Gi"

  modelServers:
    matchLabels:
      llm-d.ai/guide: async-multitenant   # set on the model server by README step 1's sed
