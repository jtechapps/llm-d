# Prometheus Operator PodMonitor that scrapes the vLLM model server so the
# self-hosted Prometheus has vllm:num_requests_running for the saturation gates.
#
# The vLLM pod is deployed via modelserver/ (optimized-baseline's GPU vLLM
# overlay), labelled llm-d.ai/guide=async-multitenant, with metrics on the
# `modelserver` port (8000). This monitor copies the pod's inference_pool and
# model labels onto the scraped series, which the saturation overlays' PromQL
# filters on.
#
# Adjust namespaceSelector / selector / port for your own model server.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm-model-server
  labels:
    app: vllm-model-server
spec:
  podTargetLabels:
    - inference_pool
    - model
  namespaceSelector:
    matchNames:
      - llm-d-async
      - default
  selector:
    matchLabels:
      llm-d.ai/guide: async-multitenant
  podMetricsEndpoints:
    - port: modelserver
      path: /metrics
      interval: 15s
