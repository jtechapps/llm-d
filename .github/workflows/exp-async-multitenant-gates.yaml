# FORK EXPERIMENT ONLY (do not merge): one variant of the async multi-tenant
# lane per dispatch, each in its own namespace and concurrency group. amt_env
# carries the variant's settings (AMT_FLOW_CONTROL, AMT_SAT_GATE, AMT_SAT_CAP,
# AMT_SAT_LEVEL, AMT_QUEUE_CAP, validator AMT_* overrides).
name: EXP - Async Multi-Tenant gate comparison (GKE GPU)

on:
  workflow_dispatch:
    inputs:
      amt_env:
        description: 'Space-separated VAR=value settings for the deploy script'
        required: true
        type: string
      run_tag:
        description: 'Short tag for the namespace and guide name (lowercase, dashes)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: exp-amt-${{ inputs.run_tag }}
  cancel-in-progress: false

jobs:
  nightly:
    uses: ./.github/workflows/fork-test-reusable-nightly-e2e-gke.yaml
    with:
      guide_name: amt-${{ inputs.run_tag }}
      guide_path: guides/batch-serving/asynchronous-processing/multitenant
      namespace: llm-d-exp-amt-${{ inputs.run_tag }}
      gateway_host: 'llm-d-router-epp'
      custom_deploy_script: |
        ${{ inputs.amt_env }} bash guides/batch-serving/asynchronous-processing/multitenant/scripts/nightly-deploy-gke.sh
      e2e_validate_args: '--extra-validate async-multitenant'
      gke_cluster_name: llm-d-e2e-us-east5
      gke_cluster_zone: us-east5
      required_gpus: 2
      recommended_gpus: 2
      accelerator_type: H100
      pod_wait_timeout: '30m'
      pod_readiness_delay: 60
      allow_gpu_preemption: false
      llm_d_ref: ${{ github.ref }}
      matrix_type: nightly
    secrets: inherit
